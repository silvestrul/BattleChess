# Battle Chess unit definitions
#
# EVERY COMBAT VALUE HERE IS PER MAN, NOT PER REGIMENT.
#
# That is the whole trick behind configurable unit sizes. A regiment's hitting
# power is its per-man attack times its headcount, so a 250-man unit is exactly
# half as strong as a 500-man one, and a 500-man unit that has lost half its
# strength is identical to a 250-man one. One rule covers both.
#
# Frontage works the same way and is never stored: files = strength / ranks,
# and frontage = files * fileWidth. So a battered regiment genuinely covers less
# ground, and gaps open in a line that has been fought hard.
#
#   ranks      how many men deep the formation stands
#   fileWidth  metres of frontage each man needs
#   rankDepth  metres between ranks
#
# At default strength the line units come out around 80-110 m wide, so roughly
# eight fit abreast on the 1000 m valley map.
#
# To add a unit: copy a block. To add a new stat: declare it in UnitAttributes
# and use it here. Neither needs any change to loading code.

[unit spearmen]
name           = Spearmen
glyph          = S
class          = Spear
movement       = Foot
# 600 men, 4 deep -> 150 files -> 90 m of frontage
ranks          = 4
fileWidth      = 0.6
rankDepth      = 1.5
defaultStrength = 600
minStrength    = 100
maxStrength    = 1200
speed          = 1.59
# A pike block is ponderous. At 2.5 deg/s a full about-face takes 72 seconds —
# longer than an entire turn — which is precisely why cavalry hunts for their
# flanks. Close to real drill at last, where a battalion needed a minute or more
# just to wheel 90 degrees in good order.
turnRate       = 2.5
zoneOfControl  = 30
# The wall cavalry cannot ride through. This one number is the spear-beats-
# cavalry counter, expressed as movement rather than as a combat special case.
stoppingPower  = 2.0
breakthrough   = 0.4
attack         = 1.0
defence        = 1.4
# Braced spears against horse. The other half of the counter: cavalry cannot
# push through them, and pays dearly if it fights them anyway.
attackVs.cavalry = 2.5
armour         = 0.25
morale         = 1.1
# Steady because of the reach, not because of the men. A spear block kills at
# two metres and the ranks behind the points barely see the fight at all, so
# the same casualties frighten them less than they frighten swordsmen. Holds
# only to the front — flanked, a spear wall has no more comfort than anyone
# else — and is no help whatever against arrows.
meleeShockResistance = 0.70
initiative     = 4
vision         = 180
costPerMan     = 1.0

[unit swordsmen]
name           = Swordsmen
glyph          = I
class          = Sword
movement       = Foot
# 500 men, 3 deep -> 167 files -> 100 m
ranks          = 3
fileWidth      = 0.6
rankDepth      = 1.5
defaultStrength = 500
minStrength    = 100
maxStrength    = 1000
speed          = 1.59
# 45 seconds to reverse. Handier than a pike block, still most of a turn.
turnRate       = 4
zoneOfControl  = 30
# Holds a line against other infantry, but cavalry rides straight through.
stoppingPower  = 1.0
breakthrough   = 0.5
attack         = 1.2
# Made for close work. Spearmen are unwieldy once anything is inside the points.
attackVs.spear     = 1.4
attackVs.archer    = 1.5
attackVs.artillery = 1.8
defence        = 1.2
armour         = 0.35
morale         = 1.0
initiative     = 5
vision         = 180
costPerMan     = 1.3

[unit archers]
name           = Archers
glyph          = A
class          = Archer
movement       = Foot
# 400 men, 3 deep -> 134 files -> 80 m
ranks          = 3
fileWidth      = 0.6
rankDepth      = 1.5
defaultStrength = 400
minStrength    = 80
maxStrength    = 800
speed          = 1.59
# Loose enough to face about in 36 seconds, which is most of how archers stay
# alive at all — though rarely fast enough once cavalry has committed.
turnRate       = 5
zoneOfControl  = 25
# Almost nothing is stopped by archers, which is the point of them.
stoppingPower  = 0.5
breakthrough   = 0.3
# Helpless in a melee because of what they DEAL, not because they are made of
# paper. Attack carries the whole of it: an archer has a knife and no shield,
# so anything that closes with them wins.
#
# Defence must not carry it, because defence is read by the shooting rule too.
# Dropping it to 0.35 to lose melees also made them 1.7x easier to shell, and a
# battery took half a regiment of bowmen off the field in three turns against
# eight percent for swordsmen. Two quite different weaknesses were riding on
# one number.
attack         = 0.15
defence        = 0.60
armour         = 0.10
# Bowmen need room to draw, so they never stand as packed as a battle line.
rangedVulnerability = 0.75
# Cut with artillery's, to shorten the whole shooting phase of a battle. At
# 145 m infantry crosses in about a turn and a half rather than three, so the
# approach costs a real price without deciding the fight before it starts.
# Infantry see 180 m, so a line now spots archers before they can reach it.
range          = 145
rangedAttack   = 1.2
reloadTicks    = 10
# Twenty-six shafts a man. A regiment of four hundred fires twenty-six volleys
# and is then a poor spear unit standing in a field, which is what makes the
# question "when do I open fire" worth asking at all.
ammunition     = 26
morale         = 0.8
initiative     = 6
vision         = 220
costPerMan     = 1.4

[unit cavalry]
name           = Cavalry
glyph          = C
class          = Cavalry
movement       = Horse
# 300 troopers, 3 deep -> 100 files -> 110 m. Horses need more room per file.
ranks          = 3
fileWidth      = 1.1
rankDepth      = 2.5
defaultStrength = 300
minStrength    = 60
maxStrength    = 600
speed          = 4.76
# 26 seconds to reverse against a pike block's 72. That gap is the whole reason
# cavalry can get round a flank faster than the flank can be presented to it.
turnRate       = 7
# Reaches further than infantry: cavalry dominates the ground around it.
zoneOfControl  = 40
# Rides through swordsmen (1.0) and everything lighter; stopped dead by a spear
# wall (2.0). Breaking through costs organization, so it is never free.
breakthrough   = 1.5
stoppingPower  = 1.2
attack         = 1.6
# Mounted men are simply hard for a footman to get at — high up, moving, and
# behind half a ton of horse. This is why a square repels cavalry without ever
# beating it: the horsemen cannot break in, but the infantry cannot reach them
# either, and the two mill about until one side tires of it.
defence        = 1.4
armour         = 0.30
# The charge is what cavalry is for. Denied it, they are mediocre.
chargeBonus    = 1.5
# What cavalry is for: catching the things that cannot answer it. Against
# spearmen it has no bonus at all, and their 2.5 against horse decides that fight.
attackVs.archer    = 1.8
attackVs.artillery = 2.2
attackVs.scout     = 1.6
# Horsemen reach down at men on foot; footmen reach up past a horse. Enough to
# beat swordsmen one to one, nowhere near enough to save them from a spear wall,
# whose 2.5 against cavalry still decides that fight completely.
attackVs.sword     = 1.6
morale         = 1.0
initiative     = 8
vision         = 250
costPerMan     = 3.0

[unit artillery]
name           = Artillery
glyph          = G
class          = Artillery
movement       = Wheeled
# 80 crew, 2 deep -> 40 files -> 40 m. Compact, but road-bound.
ranks          = 2
fileWidth      = 1.0
rankDepth      = 3.0
defaultStrength = 80
minStrength    = 20
maxStrength    = 200
speed          = 1.30
# Unlimbering and manhandling guns round is brutally slow work: a full about-face
# costs two entire turns. Point artillery the wrong way and it stays wrong.
turnRate       = 1.5
zoneOfControl  = 15
# Guns stop nothing and go through nothing.
stoppingPower  = 0.3
breakthrough   = 0.1
attack         = 0.3
defence        = 0.3
armour         = 0.05
# Still the longest reach on the field by two and a half times, but no longer
# most of a battlefield: 600 m covered nearly the whole 1000 m valley from the
# deployment line. Guns can now hit anything the army has actually spotted,
# which makes scouts and high ground the thing that unlocks their range.
range          = 360
# Devastating per shot and slow to serve. Slowed further and hit harder to
# match: a battery should be an event, not a background noise.
rangedAttack   = 6.5
reloadTicks    = 30
# Thirty rounds a gun. A battery that fired for thirty-two turns without pause
# took three quarters of a regiment off the field a handful of men at a time,
# and no amount of tuning the damage fixes that — the fault was the number of
# volleys. Now it has to be spent at the right moment.
ammunition     = 30
morale         = 0.7
initiative     = 2
vision         = 200
visibility     = 1.2
costPerMan     = 6.0

[unit scouts]
name           = Scouts
glyph          = L
class          = Scout
movement       = Horse
# 120 riders, 2 deep -> 60 files -> 66 m
ranks          = 2
fileWidth      = 1.1
rankDepth      = 2.5
defaultStrength = 120
minStrength    = 30
maxStrength    = 300
# Light horse, faster than the battle line.
speed          = 5.50
# Nimblest thing on the field at 18 seconds to reverse, which is what lets
# scouts get away from anything that corners them.
turnRate       = 10
zoneOfControl  = 20
# Slips past anything short of a braced line, and holds nobody.
breakthrough   = 1.0
stoppingPower  = 0.4
attack         = 0.5
defence        = 0.6
armour         = 0.10
# Riding down bowmen is what light horse is for, and the one melee scouts
# should expect to win. Raised again once regiments started rolling their own
# steadiness: at 3.0 a hundred and twenty scouts against four hundred bowmen
# was a coin flip, and a counter that holds three times in five is not one.
attackVs.archer    = 4.5
attackVs.artillery = 2.0
morale         = 0.6
initiative     = 9
# Barely better eyes than cavalry, and that is deliberate. A big sight radius
# makes scouting passive — park the unit somewhere safe and the map fills in for
# free. What scouts actually buy is the half below: they can get twice as close
# to anything as anyone else before they are noticed, which only pays out if you
# ride forward and look. Going and living is the job, not standing and staring.
vision         = 260
visibility     = 0.5
# Light horse ride spread out whatever order they are nominally in, so volleys
# tell far less against them. Without this they were shot off the field doing
# the one job they exist for, which made scouting a way to lose a unit.
#
# Lowered again after a scout caught at 60 m lost 45% of its strength in one
# turn — twice what swordsmen lose in three. A small regiment turns the same
# casualties into a far larger fraction, so the figure that reads as fair in
# absolute terms reads as annihilation on the screen. Being caught close should
# still hurt badly; it should not end them before they can turn round.
rangedVulnerability = 0.30
costPerMan     = 2.0

[unit horsearchers]
name           = Horse Archers
glyph          = H
class          = Archer
movement       = Horse
# 200 riders, 2 deep -> 100 files -> 110 m. Spread out, as light horse always is.
ranks          = 2
fileWidth      = 1.1
rankDepth      = 2.5
defaultStrength = 200
minStrength    = 40
maxStrength    = 400
# Slower than battle cavalry — they are carrying bows and shooting from the
# saddle, not charging home.
speed          = 4.20
turnRate       = 8
zoneOfControl  = 25
# Nothing is held by horse archers, and nothing much stops them either.
stoppingPower  = 0.4
breakthrough   = 0.9
# The whole idea: shoot, ride away, shoot again. Useless if you let them near
# anything, devastating if you cannot catch them.
attack         = 0.35
defence        = 0.70
armour         = 0.10
# Shorter than a foot bow — you cannot draw a heavy bow from a saddle — but it
# goes where the battle is.
range          = 120
rangedAttack   = 0.9
reloadTicks    = 12
# Three times a footman's quiver, because carrying it is the horse's problem.
# This is what they are for: staying in the fight long after the foot archers
# have shot themselves empty.
ammunition     = 75
# Ride loose, like all light horse.
rangedVulnerability = 0.45
morale         = 0.9
initiative     = 7
vision         = 240
visibility     = 0.7
costPerMan     = 2.6
