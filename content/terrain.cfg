# Battle Chess terrain definitions
#
# Speeds are multipliers on a unit's base speed. An omitted speed means the
# terrain cannot be entered by that movement type at all — which is why
# mountain, jungle and swamp simply say nothing about wheels.
#
# Figures are grounded in real march data rather than invented:
#   - US Army FM 21-18: 4 km/h on roads vs 2.4-2.6 km/h cross-country.
#   - Naismith's rule (5 km/h flat, +1 hour per 600 m of climb) gives 0.55x at a
#     10% grade and 0.29x at 30% — which is where hill and mountain come from.
#   - British cavalry regulations: walk 5.6 km/h, trot ~13 km/h, gallop ~17.7.
#   - Off-trail jungle runs about 1-1.5 km/h against 4 km/h on road.
#
# To add a terrain: copy a block and change the values. Nothing in code needs
# touching. To add a new setting (say, a movement noise penalty), declare it in
# TerrainAttributes and then use it here.

[terrain plains]
name          = Plains
glyph         = .
speed.foot    = 1.00
speed.horse   = 1.00
speed.wheeled = 0.90

[terrain road]
name          = Road
glyph         = +
speed.foot    = 1.20
speed.horse   = 1.30
speed.wheeled = 1.50

[terrain desert]
name          = Desert
glyph         = d
speed.foot    = 0.75
speed.horse   = 0.70
# Wheels sink in soft sand — a real problem historically, not a game contrivance.
speed.wheeled = 0.40

[terrain forest]
name          = Forest
glyph         = f
speed.foot    = 0.60
speed.horse   = 0.45
speed.wheeled = 0.20
conceals      = true
defenceBonus  = 0.15
# Trees stop arrows far better than they stop swords.
rangedCover   = 0.5
# Thick, not opaque. Infantry seeing 180 m makes out 45 m of wood — the
# regiment at the treeline, not the one standing behind it.
sightCost     = 4.0

[terrain hill]
name          = Hill
glyph         = ^
speed.foot    = 0.60
speed.horse   = 0.50
speed.wheeled = 0.35
elevation     = 1
defenceBonus  = 0.25
# Half again as far, and over anything lower than you stand. The reason to take
# a hill that has nothing to do with the fighting.
visionBonus   = 0.5

[terrain jungle]
name          = Jungle
glyph         = j
speed.foot    = 0.35
speed.horse   = 0.20
conceals      = true
defenceBonus  = 0.10
rangedCover   = 0.4
# Barely see across a clearing.
sightCost     = 6.0

[terrain river]
name          = River
glyph         = ~
speed.foot    = 0.30
speed.horse   = 0.25
speed.wheeled = 0.15
# Being caught mid-crossing is the worst place on the field to be.
defenceBonus  = -0.20
# Slow, floundering, nowhere to go and nothing to hide behind. A crossing under
# archery is the most expensive ground on the map.
rangedCover   = 1.5

[terrain mountain]
name          = Mountain
glyph         = M
speed.foot    = 0.30
speed.horse   = 0.15
elevation     = 2
defenceBonus  = 0.40
# Rocks and dead ground to get behind.
rangedCover   = 0.6
# Nothing on the map is higher, so a peak sees over everything — and an army on
# the far side of a range is invisible until it comes round.
visionBonus   = 1.0

[terrain swamp]
name          = Swamp
glyph         = s
speed.foot    = 0.30
speed.horse   = 0.15
defenceBonus  = -0.10
# Wading in the open, slowly.
rangedCover   = 1.25

[terrain deepwater]
name          = Deep water
glyph         = W
# No speeds at all: nothing on land crosses this. It is a hard map edge.
