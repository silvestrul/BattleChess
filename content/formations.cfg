# Battle Chess formation orders
#
# These are multipliers on a unit's NATURAL order, not absolute numbers, so one
# definition works for every unit type. "Form column" means the same thing to
# four-rank spearmen and to three-rank cavalry.
#
#   rankMultiplier          scales how many ranks deep the unit forms
#   fileWidthMultiplier     scales the frontage each man occupies
#   rankDepthMultiplier     scales the spacing between ranks
#   organizationCost        organization spent adopting this order, 0..1
#   stoppingMultiplier      scales how well it holds ground against a charge
#   breakthroughMultiplier  scales how well it forces through an enemy line
#
# Stopping a charge is about being BRACED, not merely present. The same spearmen
# who stop cavalry dead in square are ridden straight through in loose order —
# which is what makes choosing a formation a real decision.
#
# The FIRST formation listed is the one units are raised in, and should be the
# natural order at zero cost.
#
# Reshaping is deliberately not free. Without a cost every unit simply adopts
# whichever shape currently suits and the choice means nothing; with one, a
# regiment that has formed square under fire has paid for it, and is not the
# regiment it was ten minutes ago.

[formation line]
name                   = Line
glyph                  = L
rankMultiplier         = 1.0
organizationCost       = 0.0
stoppingMultiplier     = 1.0
breakthroughMultiplier = 1.0
rangedVulnerability    = 1.0
description            = Natural order. Maximum frontage, most men able to fight.

[formation column]
name             = Column
glyph            = C
# Three times as deep, so roughly a third of the frontage. A 300-strong cavalry
# regiment goes from 110 m wide to under 40 m and fits ground a line never could.
rankMultiplier         = 3.0
organizationCost       = 0.18
# Mass on a narrow front punches through, but there is barely any line left to
# stop anyone coming the other way.
stoppingMultiplier     = 0.6
breakthroughMultiplier = 1.3
# Deep and packed: a gunner's dream of a target.
rangedVulnerability    = 1.25
description            = Narrow and deep. Threads gaps and punches through, but almost no frontage.

[formation square]
name             = Square
glyph            = S
rankMultiplier         = 2.0
# Cheap enough to be worth adopting. At the old 28% the cost alone dropped a
# unit's cohesion far enough that the square it had just formed no longer
# stopped anything — the formation was unusable by the infantry that most
# needed it.
organizationCost       = 0.20
# Braced in every direction — the strongest thing on the field to charge into,
# and correspondingly hopeless at charging anyone. High enough that ordinary
# line infantry in square stop cavalry even after paying to form up, which is
# the historical point of the formation.
stoppingMultiplier     = 2.5
breakthroughMultiplier = 0.7
# The bind the whole system exists for. Square is the only thing that stops
# cavalry, and the easiest target on the field for anything that shoots. Form
# square against the horse and the guns will find you; stay loose against the
# guns and the horse will ride you down.
rangedVulnerability    = 1.4
description            = Compact all-round order. The answer to cavalry, and a gift to artillery.

[formation loose]
name                = Loose
glyph               = O
# Same depth, wider spacing: the men spread out rather than re-forming.
rankMultiplier         = 1.0
fileWidthMultiplier    = 1.6
rankDepthMultiplier    = 1.6
organizationCost       = 0.12
# No wall to present. Spearmen caught in loose order are ridden down by the very
# cavalry they would have stopped in line — the price of hiding from the guns.
stoppingMultiplier     = 0.5
breakthroughMultiplier = 0.6
# Its whole reason for existing. Men spread out are mostly missed.
rangedVulnerability    = 0.45
description            = Open order. Harder for guns and archers to hit, helpless against a charge.
